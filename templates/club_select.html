<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Choose Club</title>
</head>
<body>
  <h1>Clubs in {{ league_name or 'League' }}</h1>
  <ul>
  {% for club in clubs %}
    <li>{{ club.name }} - <a href="/solo?league_id={{ league_id }}&club_id={{ club.id }}">Select</a></li>
  {% else %}
    <li>No clubs found.</li>
  {% endfor %}
  </ul>
  <p><a href="/">Back</a></p>
</body>
</html>
