<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Match Result</title>
</head>
<body>
  <h1>Match Result</h1>
  <p>{{ home.name }} {{ result.home_goals }} - {{ result.away_goals }} {{ away.name }}</p>
  <ul>
  {% for line in result.commentary %}
    <li>{{ line }}</li>
  {% endfor %}
  </ul>
  <p><a href="/solo?league_id={{ league_id }}&club_id={{ club.id }}">Back to Career</a></p>
</body>
</html>
